# 자동 검증 관문(CI): push/PR 마다 GitHub가 직접 테스트·타입검사·빌드를 돌린다.
# 결과는 저장소 상단의 초록 ✓ / 빨강 ✗ 로 표시된다. 코드를 읽지 않아도 ✗만 보면 된다.
# main 에서는 검증이 초록일 때만 같은 빌드를 GitHub Pages 에 배포한다.
# 배포 주소: https://getdrivelog.com/
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-app
    steps:
      - name: react-app 받기
        uses: actions/checkout@v7
        with:
          path: react-app

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - name: 의존성 설치
        run: npm ci

      # 아래 검사들은 하나가 실패해도 나머지를 계속 돌려서 전체 그림을 보여준다.
      - name: 테스트 (npm test)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: npm test

      - name: 타입 검사 (npm run typecheck)
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: 빌드 (npm run build)
        if: ${{ !cancelled() }}
        run: npm run build

      - name: 의존 방향 검사 (npm run depcheck)
        if: ${{ !cancelled() }}
        run: npm run depcheck

      - name: CSS 이름표 구역 검사 (npm run csscheck)
        if: ${{ !cancelled() }}
        run: npm run csscheck

      - name: 코드 검사 (npm run lint)
        if: ${{ !cancelled() }}
        run: npm run lint

      # 서버 함수(운비서)는 Deno로 돈다. 앱의 package.json·tsconfig.json은 읽지 않게 한다.
      - name: Deno 받기
        if: ${{ !cancelled() }}
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.9.7

      - name: 서버 함수 타입 검사 (deno check)
        if: ${{ !cancelled() }}
        env:
          DENO_NO_PACKAGE_JSON: '1'
        run: deno check --no-config supabase/functions/unbiseo-parse/index.ts supabase/functions/unbiseo-voice/index.ts supabase/functions/unbiseo-weather/index.ts supabase/functions/send-push/index.ts

      # 시험은 환경 값만 허용한다. 바깥 호출은 가짜라 인터넷 권한은 주지 않는다.
      - name: 서버 함수 시험 (deno test)
        if: ${{ !cancelled() }}
        env:
          DENO_NO_PACKAGE_JSON: '1'
        run: deno test --no-config --allow-env supabase/functions/tests/

      # 배포용 준비는 앞 단계가 모두 성공한 main 에서만.
      - name: 깊은 주소 새로고침용 404.html
        if: ${{ success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: cp dist/index.html dist/404.html

      - name: 배포할 빌드 올리기
        if: ${{ success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: react-app/dist
          # 앱 연결 파일(.well-known)도 올린다.
          include-hidden-files: true

  # 로컬 Supabase에 운영 구조를 만들고 DB 권한 시험을 돌린다. 실패하면 배포하지 않는다.
  db-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: react-app
    env:
      SUPABASE_CLI_VERSION: 2.122.0
    steps:
      - name: react-app 받기
        uses: actions/checkout@v7
        with:
          path: react-app

      - name: Supabase 로컬 도구 받기
        run: |
          curl -fsSL "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP" supabase
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: 로컬 Supabase 띄우기
        run: supabase start

      - name: 시작점 넣고 DB 시험 돌리기
        run: bash scripts/ci-db-test.sh

  deploy:
    needs: [verify, db-test]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5
