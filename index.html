<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#eef1f5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
        if (ios) document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1')
      })()
    </script>
    <title>운행일지</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" media="print" onload="this.media='all'" />
    <script>
      (function () {
        var theme = null
        try { theme = localStorage.getItem('lastTheme') } catch (e) { theme = null }
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark')
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#121212')
      })()
    </script>
    <style>
      html { background: #eef1f5; }
      html[data-theme="dark"] { background: #121212; }
      .boot-loading {
        position: fixed; inset: 0; z-index: 50;
        display: flex; align-items: center; justify-content: center; gap: 8px;
        background: #eef1f5; color: #2d3748;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      html[data-theme="dark"] .boot-loading { background: #121212; color: #fff; }
      .boot-loading-inline { position: static; min-height: 60vh; background: transparent; }
      html[data-theme="dark"] .boot-loading-inline { background: transparent; }
      .boot-loading img { height: 40px; width: auto; }
      .boot-loading-name { font-family: 'Jua', sans-serif; font-size: 22px; font-weight: 400; letter-spacing: -0.5px; }
      .boot-loading-dots { display: inline-flex; gap: 5px; margin-left: 2px; }
      .boot-loading-dots span {
        width: 7px; height: 7px; border-radius: 50%; background: currentColor;
        animation: boot-loading-dot 1.2s infinite ease-in-out;
      }
      .boot-loading-dots span:nth-child(2) { animation-delay: 0.2s; }
      .boot-loading-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes boot-loading-dot {
        0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
        40% { opacity: 1; transform: translateY(-3px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-loading-dots span { animation: none; opacity: 0.6; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loading" role="status" aria-label="불러오는 중">
        <img src="/images/banner_image.png" alt="" />
        <span class="boot-loading-name">운행일지</span>
        <span class="boot-loading-dots" aria-hidden="true"><span></span><span></span><span></span></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
