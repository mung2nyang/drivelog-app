# 실제 DB 시험(CI)용 로컬 Supabase 설정. DB와 로그인(auth)만 띄운다.
project_id = "drivelog"

[api]
enabled = false

[db]
major_version = 17

# 0031까지는 시작점 파일에 들어 있어 migrations 폴더를 자동으로 넣지 않는다.
[db.migrations]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
